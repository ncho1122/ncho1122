<style>
.drift { animation: drift linear infinite; }
@keyframes drift { from { transform: translateX(-120px); } to { transform: translateX(860px); } }
.twinkle { animation: twinkle 2.4s steps(2, end) infinite; }
@keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: 0.15; } }
.glow { animation: glow 3s steps(3, end) infinite; }
@keyframes glow { 0%, 100% { opacity: 0.12; } 50% { opacity: 0.35; } }
.bob { animation: bob 2s steps(1, end) infinite; }
@keyframes bob { 0% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
</style>
